[workspace]
resolver = "3"
members = ["crates/wb-core", "crates/whaybench", "crates/whaybench-term", "crates/wb-store", "crates/whaybench-panel", "crates/whaybench-tools"]
exclude = ["third_party/smithay"]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/whaybench/whaybench"
description = "A desktop workspace for working with a coding agent: conversation map, sessions, answers and views as panels on one surface"

[workspace.lints.clippy]
# Style the code keeps on purpose: tuples and closures named where they are used, and wide drawing functions.
type_complexity = "allow"
too_many_arguments = "allow"
# `from_desktop` takes what the desktop's clipboard holds into this one; it is not a constructor.
wrong_self_convention = "allow"

[workspace.dependencies]
wb-core = { path = "crates/wb-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.17"
libc = "0.2"
ab_glyph = "0.2"

[workspace.dependencies.smithay]
path = "third_party/smithay"
default-features = false
features = ["backend_drm", "backend_winit", "wayland_frontend", "desktop"]
