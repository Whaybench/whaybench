[package]
name = "whaybench-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wb-core.workspace = true
serde_json.workspace = true
glob = "0.3"
# AT-SPI over D-Bus for whaybench-view read --firefox; the same gio the panels build on.
gio = "0.22"

[[bin]]
name = "whaybench-view"
path = "src/bin/view.rs"

[[bin]]
name = "whaybench-files"
path = "src/bin/files.rs"
