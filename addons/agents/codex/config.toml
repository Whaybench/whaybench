# Written into Codex's config.toml in its Whaybench folder each time a Codex tab opens.

# The map tool as Codex's MCP server. Codex passes an MCP server only the variables it lists.
[mcp_servers.whaybench]
command = "{exe}"
args = ["mcp", "--data-dir", "{data}"]
env_vars = ["WHAYBENCH_TAB"]

# The map is kept every turn, so its tool runs without asking each time.
[mcp_servers.whaybench.tools.context_map]
approval_mode = "approve"

# Whaybench's commands write their requests in these folders of the data folder: whaybench-view in view and show,
# whaybench-project in projects, whaybench-files in node-files. Only these: the rest (Codex's own settings, the
# add-ons, the other tabs' input) stays out of reach, or Codex could undo its own sandbox.
[sandbox_workspace_write]
writable_roots = ["{data}/view", "{data}/show", "{data}/projects", "{data}/node-files"]
