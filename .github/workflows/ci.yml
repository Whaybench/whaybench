# Build and test on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libxkbcommon-dev libwayland-dev libegl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/fetch-smithay.sh
      - run: cargo test --workspace --locked
