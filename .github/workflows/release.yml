# A tag v<version> builds the programs and publishes them, with install.sh, as a GitHub release.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Whaybench Setup for Windows (windows/whaybench.iss), built where Inno Setup runs.
  windows-setup:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Inno Setup and the build
        shell: pwsh
        run: |
          $tag = $env:INNO -replace '\.', '_'
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-$tag/innosetup-$env:INNO.exe" -OutFile is.exe
          if ((Get-FileHash is.exe -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw "Inno Setup does not match its checksum" }
          Start-Process -Wait is.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NOICONS", "/DIR=$env:RUNNER_TEMP\inno"
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Qp "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" windows\whaybench.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        env:
          INNO: 6.7.4
          INNO_SHA256: A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: windows/Output/WhaybenchSetup.exe
          if-no-files-found: error

  release:
    needs: windows-setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The packages' .deb files are kept in GitHub's cache (saved only when the job succeeds), so a slow or broken
      # Ubuntu mirror costs one download, not every run. One list for CI and Release: a tag finds what main stored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ hashFiles('.github/apt-packages.txt') }}
      - name: System packages
        run: |
          mkdir -p ~/apt-debs/partial
          get() { sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-debs" $(cat .github/apt-packages.txt); }
          get || { sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|' /etc/apt/apt-mirrors.txt; get; }
          sudo chown -R "$USER" ~/apt-debs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: tools/fetch-smithay.sh
      - run: cargo build --release --locked
      # Alacritty, for the terminal tabs: not every distribution packages it, so the release brings it.
      - name: Alacritty
        run: |
          git clone --quiet --depth 1 --branch "v$ALACRITTY" https://github.com/alacritty/alacritty alacritty-src
          cargo build --release --locked --manifest-path alacritty-src/Cargo.toml -p alacritty
        env:
          ALACRITTY: 0.17.0
      - name: Third-party licences
        run: |
          curl -fsSL -o about.tgz "https://github.com/EmbarkStudios/cargo-about/releases/download/$ABOUT/cargo-about-$ABOUT-x86_64-unknown-linux-musl.tar.gz"
          echo "$ABOUT_SHA256  about.tgz" | sha256sum -c -
          tar xzf about.tgz --strip-components=1 -C ~/.cargo/bin "cargo-about-$ABOUT-x86_64-unknown-linux-musl/cargo-about"
          cargo about generate -c tools/about.toml tools/about.hbs -o THIRD-PARTY-LICENSES.html
          (cd alacritty-src && cargo about generate -c ../tools/about.toml ../tools/about.hbs -o ../ALACRITTY-THIRD-PARTY-LICENSES.html)
        env:
          ABOUT: 0.9.3
          ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
      - name: Package
        run: |
          dir=whaybench-x86_64-linux
          mkdir "$dir"
          cp target/release/{whaybench,whaybench-panel,whaybench-term,whaybench-view,whaybench-project,whaybench-files} LICENSE NOTICE README.md "$dir"/
          cp alacritty-src/target/release/alacritty THIRD-PARTY-LICENSES.html ALACRITTY-THIRD-PARTY-LICENSES.html "$dir"/
          cp alacritty-src/LICENSE-APACHE "$dir"/ALACRITTY-LICENSE-APACHE
          cp alacritty-src/LICENSE-MIT "$dir"/ALACRITTY-LICENSE-MIT
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-setup
      # What Whaybench Setup's install.ps1 fetches when it runs on its own.
      - run: cp windows/setup-wsl.sh windows/whaybench.ico .
      # Whaybench updates itself only with files signed here (crates/wb-core/src/update.rs checks them against the
      # public key it carries); the trusted comment names the version and the file.
      - name: Signatures
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "the MINISIGN_SECRET_KEY secret is missing" >&2; exit 1; }
          sudo apt-get install -y minisign
          v="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/release.key"
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          for f in install.sh whaybench-x86_64-linux.tar.gz setup-wsl.sh; do
            minisign -S -s "$key" -m "$f" -x "$f.minisig" -t "whaybench $v $f"
          done
          rm -f "$key"
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"; version="${version%%-*}"  # a pre-release shows the notes of the version it leads to
          awk -v v="$version" '/^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a '-' (v0.2.0-rc.1) is a pre-release: never the latest one install.sh takes.
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "Whaybench ${GITHUB_REF_NAME#v}" --notes-file notes.md whaybench-x86_64-linux.tar.gz whaybench-x86_64-linux.tar.gz.sha256 whaybench-x86_64-linux.tar.gz.minisig install.sh install.sh.minisig WhaybenchSetup.exe setup-wsl.sh setup-wsl.sh.minisig whaybench.ico
