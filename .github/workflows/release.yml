# A tag v<version> builds the programs and publishes them, with install.sh, as a GitHub release.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The packages' .deb files are kept in GitHub's cache (saved only when the job succeeds), so a slow or broken
      # Ubuntu mirror costs one download, not every run. One list for CI and Release: a tag finds what main stored.
      - uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: apt-debs-${{ hashFiles('.github/apt-packages.txt') }}
      - name: System packages
        run: |
          mkdir -p ~/apt-debs/partial
          get() { sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-debs" $(cat .github/apt-packages.txt); }
          get || { sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|' /etc/apt/apt-mirrors.txt; get; }
          sudo chown -R "$USER" ~/apt-debs
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/fetch-smithay.sh
      - run: cargo build --release --locked
      # Alacritty, for the terminal tabs: not every distribution packages it, so the release brings it.
      - name: Alacritty
        run: |
          git clone --quiet --depth 1 --branch "v$ALACRITTY" https://github.com/alacritty/alacritty alacritty-src
          cargo build --release --locked --manifest-path alacritty-src/Cargo.toml -p alacritty
        env:
          ALACRITTY: 0.17.0
      - name: Third-party licences
        run: |
          curl -fsSL -o about.tgz "https://github.com/EmbarkStudios/cargo-about/releases/download/$ABOUT/cargo-about-$ABOUT-x86_64-unknown-linux-musl.tar.gz"
          echo "$ABOUT_SHA256  about.tgz" | sha256sum -c -
          tar xzf about.tgz --strip-components=1 -C ~/.cargo/bin "cargo-about-$ABOUT-x86_64-unknown-linux-musl/cargo-about"
          cargo about generate -c tools/about.toml tools/about.hbs -o THIRD-PARTY-LICENSES.html
          (cd alacritty-src && cargo about generate -c ../tools/about.toml ../tools/about.hbs -o ../ALACRITTY-THIRD-PARTY-LICENSES.html)
        env:
          ABOUT: 0.9.3
          ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
      - name: Package
        run: |
          dir=whaybench-x86_64-linux
          mkdir "$dir"
          cp target/release/{whaybench,whaybench-panel,whaybench-term,whaybench-view,whaybench-project,whaybench-files} LICENSE NOTICE README.md "$dir"/
          cp alacritty-src/target/release/alacritty THIRD-PARTY-LICENSES.html ALACRITTY-THIRD-PARTY-LICENSES.html "$dir"/
          cp alacritty-src/LICENSE-APACHE "$dir"/ALACRITTY-LICENSE-APACHE
          cp alacritty-src/LICENSE-MIT "$dir"/ALACRITTY-LICENSE-MIT
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"; version="${version%%-*}"  # a pre-release shows the notes of the version it leads to
          awk -v v="$version" '/^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a '-' (v0.2.0-rc.1) is a pre-release: never the latest one install.sh takes.
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "Whaybench ${GITHUB_REF_NAME#v}" --notes-file notes.md whaybench-x86_64-linux.tar.gz whaybench-x86_64-linux.tar.gz.sha256 install.sh
